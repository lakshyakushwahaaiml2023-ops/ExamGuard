services:
  - type: web
    name: examguard
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm rebuild better-sqlite3 && cd client && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
